server.port=${PORT:10000}
server.forward-headers-strategy=framework
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}?currentSchema=payments
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.flyway.default-schema=payments
spring.flyway.schemas=payments
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH_HOST}/realms/ledgerflow
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://${AUTH_HOST}/realms/ledgerflow/protocol/openid-connect/certs
ledger.base-url=https://${LEDGER_HOST}
ledger.token-url=https://${AUTH_HOST}/realms/ledgerflow/protocol/openid-connect/token
