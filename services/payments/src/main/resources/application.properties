server.port=8083
spring.application.name=payments
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8180/realms/ledgerflow}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.datasource.url=${PAYMENTS_DB_URL:jdbc:postgresql://localhost:5432/payments}
spring.datasource.username=${PAYMENTS_DB_USER:payments}
spring.datasource.password=${PAYMENTS_DB_PASSWORD}
ledger.base-url=${LEDGER_BASE_URL:http://localhost:8081}
ledger.token-url=${LEDGER_TOKEN_URL:http://localhost:8180/realms/ledgerflow/protocol/openid-connect/token}
ledger.client-id=payments-service
ledger.client-secret=${PAYMENTS_CLIENT_SECRET:}
transfers.recovery-delay-ms=5000
