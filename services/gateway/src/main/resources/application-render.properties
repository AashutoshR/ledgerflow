server.port=${PORT:10000}
server.forward-headers-strategy=framework
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH_HOST}/realms/ledgerflow
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://${AUTH_HOST}/realms/ledgerflow/protocol/openid-connect/certs
services.workspace-url=https://${WORKSPACE_HOST}
services.ledger-url=https://${LEDGER_HOST}
services.payments-url=https://${PAYMENTS_HOST}
app.demo-enabled=false
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=10000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=120s
