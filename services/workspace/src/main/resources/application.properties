server.port=8086
spring.application.name=workspace
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8180/realms/ledgerflow}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.datasource.url=${WORKSPACE_DB_URL:jdbc:postgresql://localhost:5432/workspace}
spring.datasource.username=${WORKSPACE_DB_USER:workspace}
spring.datasource.password=${WORKSPACE_DB_PASSWORD}
