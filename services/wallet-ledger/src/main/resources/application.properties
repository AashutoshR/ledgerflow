server.port=8081
spring.application.name=wallet-ledger
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8180/realms/ledgerflow}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledger}
spring.datasource.username=${DB_USER:ledger}
spring.datasource.password=${DB_PASSWORD}
ledger.test-funding-enabled=${TEST_FUNDING_ENABLED:false}
